services:
  - type: web
    name: cost-efficient-rag-service
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m src.cli ingest --store lancedb && python -m src.cli ingest --store qdrant"
    healthCheckPath: /health
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "https://synergylabs-lilac.vercel.app"
      - key: SIMILARITY_THRESHOLD
        value: "0.68"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DEFAULT_VECTOR_STORE
        value: lancedb
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: DEFAULT_CHUNK_SIZE
        value: "500"
      - key: DEFAULT_CHUNK_OVERLAP
        value: "50"
