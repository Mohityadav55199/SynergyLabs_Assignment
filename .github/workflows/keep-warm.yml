name: Keep Render Backend Warm

on:
  schedule:
    # Run every 10 minutes to keep Render free tier container active (Render sleeps after 15m inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-warm:
    name: Ping Render Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Render backend at $(date -u)..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 60 "https://cost-efficient-rag-service.onrender.com/health")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render backend is warm and healthy! (HTTP $STATUS)"
          else
            echo "⚠️ Non-200 response: $STATUS (Container may be cold-booting)"
          fi
